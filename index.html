<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Forms</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body>

    <div class="container bg-warning p-5 mt-5 mb-5 rounded">


        <form action="" method="post">

            <h2><strong>CUSTOM SNEAKER ORDER FORM</strong></h2>

            <!-- NAME -->
            <label for="form-name" class="form-label">Name:</label> 
            <input type="text" name="username" id="form-name" class="textinput form-control">
            
            <br>

            <!-- EMAIL -->
            <label for="form-email" class="form-label">Email:</label> 
            <input type="email" name="emailaddress" id="form-email"class="textinput form-control">

            <br>

            <!-- TELEPHONE -->
            <label for="form-tel" class="form-label">Telephone:</label> 
            <input type="tel" name="telephone" id="form-tel"class="textinput form-control">

            <br>

            <!-- TELL US -->
            <label for="form-story" class="form-label">Tell us about yourself:</label> 
            <textarea class="form-control" name="story" maxlength="600" id="form-story" placeholder="No more than 600 characters long"></textarea>
            
           <br>
           
            <label for="sizes">Size:</label>
            <select class="form-select" name="size" id="sizes">
                <option>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
                <option>10</option>
                <option>11</option>
                <option>12</option>
                <option>13</option>
            </select> 
            
            <em>Sizes reflect standard US men's sizes</em>

            <br>
            <br>
                
            <label  for="colors">Sneaker Color:</label>
            
            <fieldset id="colors">
                <legend>Color</legend>

                <div class="form-check">
                    <label class="form-check-label"><input class="form-check-input" type="radio" name="color" value="red"> Red</label>
                </div>

                <div class="form-check">
                    <label class="form-check-label"><input type="radio" class="form-check-input" name="color" value="blue"> Blue</label> 
                </div>
                
                <div class="form-check">
                    <label class="form-check-label"><input type="radio" class="form-check-input" name="color" value="black"> Black</label> 
                </div>

                <div class="form-check">
                    <label class="form-check-label"><input type="radio" class="form-check-input" name="color" value="silver"> Silver</label>
                </div>

            </fieldset>

            <br>
            <br>
                
            <label for="features">Add-on Features:</label>
            <fieldset id="features">
                <legend>Feature</legend>

                <div class="form-check">
                    <label class="form-check-label">
                        <input class="form-check-input" type="checkbox" name="feature" value="laces"> Sparkley laces</label>
                </div>

                <div class="form-check">
                    <label class="form-check-label">
                        <input class="form-check-input" type="checkbox" name="feature" value="logo" checked> Metallic logo</label>
                </div>

                <div class="form-check">
                    <label class="form-check-label">
                        <input class="form-check-input" type="checkbox" name="feature" value="heels"> Light-up heels</label>
                </div>

                <div class="form-check">
                    <label class="form-check-label">
                        <input class="form-check-input" type="checkbox" name="feature" value="mp3"> MP3-enabled</label>
                </div>
            </fieldset>

            <br>
            <br>
            

            <button type="button" class="btn btn-info" value="ENTER">ENTER
 
        </form>
    </div>
</body>
</html>
